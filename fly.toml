# Split — Fly.io config.
# App name: change `app` here (and in the deploy commands) if split-salmans is taken.
app = 'split-salmans'
primary_region = 'iad' # Ashburn, VA — closest to the user (Washington, DC)

[build]
  dockerfile = 'Dockerfile'

# One always-on machine; the volume below is what keeps the SQLite data
# (and receipt photos) alive across deploys/restarts.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/api/health'
    protocol = 'http'
    timeout = '5s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'

[[mounts]]
  source = 'split_data'
  destination = '/app/data'
